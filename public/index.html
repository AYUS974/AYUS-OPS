<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AYUS Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #161B2C;
    --panel: #1D2438;
    --panel-2: #222A42;
    --line: #2B3450;
    --ink: #E9ECF6;
    --muted: #8C95B3;
    --pending: #F2B14E;
    --approve: #57BE8C;
    --reject: #E06A5B;
    --sales: #6FA8FF;
    --finance: #C9A6FF;
    --marketing: #FF9D7E;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Space Grotesk", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 28px clamp(16px, 4vw, 48px) 64px;
  }
  a { color: inherit; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .wordmark { display: flex; align-items: baseline; gap: 10px; }
  .wordmark h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.04em; }
  .wordmark span {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px;
  }
  .run-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 500;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 18px; cursor: pointer; transition: border-color .15s;
  }
  .run-btn:hover { border-color: var(--pending); }
  .run-btn:disabled { opacity: .5; cursor: wait; }
  :is(button, [tabindex]):focus-visible { outline: 2px solid var(--pending); outline-offset: 2px; }

  /* ---------- daily brief wire ---------- */
  .wire {
    display: flex; align-items: flex-start; gap: 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--pending);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 28px;
  }
  .lamp {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--pending); margin-top: 5px; flex: none;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .lamp { animation: none; } }
  .wire-label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    color: var(--pending); margin-bottom: 5px;
  }
  .wire-text { font-family: var(--mono); font-size: 13px; line-height: 1.65; color: var(--ink); }
  .wire-date { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 7px; }

  /* ---------- queue ---------- */
  .queue-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .queue-head h2 { font-size: 15px; font-weight: 500; letter-spacing: .02em; }
  .count { font-family: var(--mono); font-size: 12px; color: var(--pending); }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;
  }
  .card-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .agent-tag {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
    border: 1px solid currentColor;
  }
  .agent-sales { color: var(--sales); }
  .agent-finance { color: var(--finance); }
  .agent-marketing { color: var(--marketing); }
  .agent-orchestrator { color: var(--muted); }
  .card-time { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; }
  .card h3 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .card .summary { font-size: 13.5px; color: var(--muted); line-height: 1.55; }

  details { margin-top: 10px; }
  summary {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  summary:hover { color: var(--ink); }
  .payload {
    font-family: var(--mono); font-size: 12px; line-height: 1.7;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin-top: 8px; white-space: pre-wrap; word-break: break-word;
    color: var(--ink); max-height: 320px; overflow: auto;
  }

  .card-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    font-family: var(--sans); font-size: 13.5px; font-weight: 500;
    border-radius: 8px; padding: 8px 18px; cursor: pointer;
    border: 1px solid transparent; transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn-approve { background: var(--approve); color: #0E1422; }
  .btn-reject { background: transparent; color: var(--reject); border-color: var(--reject); }

  .empty {
    border: 1px dashed var(--line); border-radius: 10px;
    padding: 36px 20px; text-align: center; color: var(--muted); font-size: 14px;
  }
  .empty .hint { font-family: var(--mono); font-size: 12px; margin-top: 8px; }

  /* ---------- runs log ---------- */
  .runs { margin-top: 36px; }
  .runs h2 { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .04em; margin-bottom: 10px; }
  .run-row {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .run-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .run-ok { background: var(--approve); }
  .run-error { background: var(--reject); }
  .run-row .agent { color: var(--ink); min-width: 84px; }
  .run-row .when { margin-left: auto; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    font-family: var(--mono); font-size: 12.5px; padding: 10px 18px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <h1>AYUS&nbsp;OPS</h1>
    <span>mission control</span>
  </div>
  <button class="run-btn" id="runBtn" onclick="runNow()">Run agents now</button>
</header>

<section class="wire" id="wire" hidden>
  <div class="lamp"></div>
  <div>
    <div class="wire-label">DAILY BRIEF</div>
    <div class="wire-text" id="digestText"></div>
    <div class="wire-date" id="digestDate"></div>
  </div>
</section>

<section>
  <div class="queue-head">
    <h2>Awaiting your decision</h2>
    <span class="count" id="count"></span>
  </div>
  <div id="queue"></div>
</section>

<section class="runs">
  <h2>Recent agent runs</h2>
  <div id="runs"></div>
</section>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

function timeAgo(iso) {
  const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.floor(hrs / 24) + "d ago";
}

function payloadPreview(action) {
  const p = action.payload || {};
  if (action.type === "send_followup" || action.type === "send_reminder") {
    return "To: " + (p.to || "—") + "\nSubject: " + (p.subject || "—") + "\n\n" + (p.body || "");
  }
  if (action.type === "content_review" && p.review) {
    const r = p.review;
    return "Verdict: " + (r.verdict || "") +
      "\n\nHooks:\n" + (r.hooks || []).map((h, i) => (i + 1) + ". " + h).join("\n") +
      "\n\nImprovements:\n" + (r.improvements || []).map(x => "- " + x).join("\n");
  }
  return JSON.stringify(p, null, 2);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function load() {
  let data;
  try {
    const res = await fetch("/api/overview");
    data = await res.json();
    if (data.error) throw new Error(data.error);
  } catch (err) {
    $("queue").innerHTML = '<div class="empty">Could not reach the server or database.<div class="hint">' + esc(err.message) + "</div></div>";
    return;
  }

  // digest
  if (data.digest) {
    $("wire").hidden = false;
    $("digestText").textContent = data.digest.content;
    $("digestDate").textContent = new Date(data.digest.created_at).toLocaleString();
  }

  // queue
  const actions = data.actions || [];
  $("count").textContent = actions.length ? actions.length + " pending" : "";
  if (!actions.length) {
    $("queue").innerHTML = '<div class="empty">Queue is clear. Nothing needs you right now.<div class="hint">Agents run daily, or hit “Run agents now”.</div></div>';
  } else {
    $("queue").innerHTML = actions.map(a => `
      <div class="card" id="card-${a.id}">
        <div class="card-top">
          <span class="agent-tag agent-${esc(a.agent)}">${esc(a.agent)}</span>
          <span class="card-time">${timeAgo(a.created_at)}</span>
        </div>
        <h3>${esc(a.title)}</h3>
        <div class="summary">${esc(a.summary || "")}</div>
        <details>
          <summary>view full ${a.type === "content_review" ? "review" : "draft"}</summary>
          <div class="payload">${esc(payloadPreview(a))}</div>
        </details>
        <div class="card-actions">
          <button class="btn btn-approve" onclick="decide('${a.id}','approved',this)">Approve &amp; execute</button>
          <button class="btn btn-reject" onclick="decide('${a.id}','rejected',this)">Reject</button>
        </div>
      </div>
    `).join("");
  }

  // runs
  $("runs").innerHTML = (data.runs || []).map(r => `
    <div class="run-row">
      <span class="run-dot ${r.status === "ok" ? "run-ok" : "run-error"}"></span>
      <span class="agent">${esc(r.agent)}</span>
      <span>${esc(r.summary || "")}</span>
      <span class="when">${timeAgo(r.created_at)}</span>
    </div>
  `).join("") || '<div class="run-row">No runs yet.</div>';
}

async function decide(id, decision, btn) {
  btn.disabled = true;
  try {
    const res = await fetch(`/api/actions/${id}/decide`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    toast(decision === "approved" ? "Approved — executed" : "Rejected");
    document.getElementById("card-" + id)?.remove();
    load();
  } catch (err) {
    toast("Failed: " + err.message);
    btn.disabled = false;
  }
}

async function runNow() {
  const btn = $("runBtn");
  btn.disabled = true;
  btn.textContent = "Agents running…";
  try {
    const res = await fetch("/api/run", { method: "POST" });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    toast("Run complete");
    load();
  } catch (err) {
    toast("Run failed: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Run agents now";
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
