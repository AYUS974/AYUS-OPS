<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>AYUS — Reactor</title>
<style>
  :root{
    --accent:#22d3ee;        /* live accent, set per state by JS */
    --bg0:#03060d;
    --bg1:#0a1422;
    --ink:#cfe8f2;
    --muted:#5d7b8a;
    --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1200px 800px at 50% 42%, var(--bg1), var(--bg0) 70%),
      var(--bg0);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* faint HUD grid */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
    background:
      linear-gradient(transparent 95%, rgba(34,211,238,.25) 0) 0 0/100% 28px,
      linear-gradient(90deg, transparent 95%, rgba(34,211,238,.18) 0) 0 0/28px 100%;
    mask:radial-gradient(900px 600px at 50% 45%, #000 30%, transparent 75%);
  }
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD overlay ---------- */
  .hud{position:fixed;inset:0;pointer-events:none}
  .brand{
    position:absolute;top:26px;left:0;right:0;text-align:center;
    letter-spacing:.55em;font-size:13px;color:var(--muted);text-indent:.55em;
  }
  .brand b{color:var(--ink);font-weight:600}

  .state-chip{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;
  }
  .state-chip .word{
    font-size:15px;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;
    color:var(--accent);text-shadow:0 0 18px color-mix(in srgb,var(--accent) 70%,transparent);
  }
  .state-chip .sub{margin-top:8px;font-size:11px;color:var(--muted);letter-spacing:.2em}

  .panel{
    position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
    width:min(760px,92vw);pointer-events:auto;
  }
  .transcript{
    min-height:64px;max-height:160px;overflow:auto;
    background:linear-gradient(180deg, rgba(10,20,34,.55), rgba(6,12,22,.65));
    border:1px solid rgba(34,211,238,.18);border-radius:16px;
    padding:14px 18px;font-size:15px;line-height:1.5;
    backdrop-filter:blur(8px);box-shadow:0 0 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .transcript .you{color:var(--ink)}
  .transcript .you::before{content:"YOU  ";color:var(--muted);font-size:11px;letter-spacing:.2em}
  .transcript .ai{color:var(--accent);margin-top:8px}
  .transcript .ai::before{content:"AYUS  ";color:var(--muted);font-size:11px;letter-spacing:.2em}
  .transcript .interim{color:var(--muted);font-style:italic}

  .controls{display:flex;gap:10px;margin-top:14px;align-items:center;justify-content:center}
  .controls input{
    flex:1;background:rgba(8,16,28,.6);border:1px solid rgba(34,211,238,.2);
    color:var(--ink);border-radius:12px;padding:12px 16px;font-family:var(--mono);font-size:14px;outline:none;
  }
  .controls input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  .btn{
    pointer-events:auto;cursor:pointer;user-select:none;
    border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.08);
    color:var(--ink);border-radius:12px;padding:12px 18px;font-family:var(--mono);
    font-size:13px;letter-spacing:.12em;transition:.15s;
  }
  .btn:hover{background:rgba(34,211,238,.18);border-color:var(--accent)}
  .btn.live{background:color-mix(in srgb,var(--accent) 28%,transparent);border-color:var(--accent);
    box-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent)}
  .hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);letter-spacing:.18em}
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>

  <div class="hud">
    <div class="brand"><b>A Y U S</b> &nbsp;·&nbsp; REACTOR</div>

    <div class="state-chip">
      <div class="word" id="stateWord">STANDBY</div>
      <div class="sub" id="stateSub">tap TALK or type below</div>
    </div>

    <div class="panel">
      <div class="transcript" id="transcript"></div>
      <div class="controls">
        <div class="btn" id="talkBtn">◉ TALK</div>
        <input id="text" placeholder="…or type to AYUS and press Enter" autocomplete="off" />
        <div class="btn" id="stopBtn">■ STOP</div>
      </div>
    </div>
    <div class="hint">SPACE = push-to-talk &nbsp;·&nbsp; best on http://localhost (mic + speech)</div>
  </div>

<script>
/* =============================================================
   AYUS Reactor — a self-contained JARVIS-style voice HUD.
   - Audio-reactive reactor orb on canvas
   - States: STANDBY · LISTENING · THINKING · ACTING · SPEAKING
   - Live transcript (interim + final) via Web Speech API
   - Mic level via Web Audio AnalyserNode
   - Speaks replies via speechSynthesis (deep British voice if available)

   >>> TO CONNECT THE REAL BRAIN: replace the body of askAyus() with a
       fetch() to your secretary endpoint (Claude + secretaryAgent.js).
   ============================================================= */

const STATE_COLORS = {
  standby:   '#22d3ee',
  listening: '#34f5c5',
  thinking:  '#f5b830',
  acting:    '#ff5d8f',
  speaking:  '#7cd9ff',
};
const STATE_SUB = {
  standby:   'tap TALK or type below',
  listening: 'listening…',
  thinking:  'thinking…',
  acting:    'working…',
  speaking:  'speaking…',
};

let state = 'standby';
function setState(s){
  state = s;
  document.documentElement.style.setProperty('--accent', STATE_COLORS[s]);
  document.getElementById('stateWord').textContent = s.toUpperCase();
  document.getElementById('stateSub').textContent  = STATE_SUB[s];
}

/* ---------- transcript ---------- */
const tEl = document.getElementById('transcript');
let interimEl = null;
function addLine(cls, text){
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  tEl.appendChild(d); tEl.scrollTop = tEl.scrollHeight;
  return d;
}
function showInterim(text){
  if(!interimEl){ interimEl = addLine('you interim', ''); }
  interimEl.textContent = text;
  tEl.scrollTop = tEl.scrollHeight;
}
function commitUser(text){
  if(interimEl){ interimEl.remove(); interimEl = null; }
  addLine('you', text);
}

/* =============================================================
   AUDIO — mic analyser drives the reactor's reactivity
   ============================================================= */
let audioCtx, analyser, freqData, timeData, micStream;
let level = 0;          // smoothed 0..1 amplitude
let speakingPulse = 0;  // extra energy injected while AYUS talks

async function startMic(){
  if(analyser) return true;
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.8;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    src.connect(analyser);
    return true;
  }catch(e){ return false; }
}
function readLevel(){
  let target = 0;
  if(analyser && state === 'listening'){
    analyser.getByteTimeDomainData(timeData);
    let sum = 0;
    for(let i=0;i<timeData.length;i++){ const v=(timeData[i]-128)/128; sum += v*v; }
    target = Math.min(1, Math.sqrt(sum/timeData.length) * 3.2);
    analyser.getByteFrequencyData(freqData);
  } else {
    // ambient breathing + talking energy when no live mic input
    const t = performance.now()/1000;
    target = 0.12 + 0.05*Math.sin(t*1.6) + speakingPulse;
  }
  level += (target - level) * 0.18;             // smooth
  speakingPulse *= 0.9;                          // decay talk spikes
  return level;
}

/* =============================================================
   REACTOR — canvas renderer
   ============================================================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

const N = 96;                 // frequency bars around the ring
const particles = Array.from({length:48},(_,i)=>({
  a: Math.random()*Math.PI*2, r: 0.62+Math.random()*0.5, spd:(Math.random()*0.6+0.2)*(Math.random()<.5?-1:1), sz:Math.random()*1.6+0.6
}));

function draw(now){
  const lvl = readLevel();
  const cx = W/2, cy = H*0.46;
  const base = Math.min(W,H) * 0.16;
  const accent = STATE_COLORS[state];
  const spin = now/1000;
  ctx.clearRect(0,0,W,H);

  // ----- outer HUD rings -----
  const rings = [
    {r:base*1.9, w:1,   seg:false, sp:0.06,  al:.20},
    {r:base*2.25,w:1.5, seg:true,  sp:-0.14, al:.30},
    {r:base*2.7, w:1,   seg:false, sp:0.22,  al:.12},
  ];
  for(const rg of rings){
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(spin*rg.sp*4);
    ctx.strokeStyle = accent; ctx.globalAlpha = rg.al; ctx.lineWidth = rg.w;
    if(rg.seg){
      const segs = 24;
      for(let i=0;i<segs;i++){
        if(i%3===0) continue;
        const a0 = (i/segs)*Math.PI*2, a1 = a0 + (Math.PI*2/segs)*0.62;
        ctx.beginPath(); ctx.arc(0,0,rg.r,a0,a1); ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.arc(0,0,rg.r,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  // ----- circular frequency bars (voice spectrum) -----
  ctx.save();
  ctx.translate(cx,cy);
  ctx.globalAlpha = .9; ctx.lineCap='round';
  const r0 = base*1.32;
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2 - Math.PI/2;
    let mag;
    if(analyser && state==='listening'){
      mag = (freqData[Math.floor(i/N*freqData.length)]/255);
    }else{
      mag = (0.25 + 0.75*Math.abs(Math.sin(i*0.5 + spin*2)))*(0.3+lvl);
    }
    const len = base*0.12 + mag*base*0.95*(0.5+lvl);
    const x0=Math.cos(a)*r0, y0=Math.sin(a)*r0;
    const x1=Math.cos(a)*(r0+len), y1=Math.sin(a)*(r0+len);
    ctx.strokeStyle = accent;
    ctx.globalAlpha = 0.35 + mag*0.55;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }
  ctx.restore();

  // ----- orbiting particles -----
  ctx.save(); ctx.translate(cx,cy);
  for(const p of particles){
    p.a += p.spd*0.006;
    const pr = base*p.r*(1.4+lvl*0.3);
    const x=Math.cos(p.a)*pr, y=Math.sin(p.a)*pr;
    ctx.globalAlpha=.5; ctx.fillStyle=accent;
    ctx.beginPath(); ctx.arc(x,y,p.sz,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // ----- core glow -----
  const coreR = base*(0.72 + lvl*0.55);
  const g = ctx.createRadialGradient(cx,cy,0, cx,cy,coreR*1.8);
  g.addColorStop(0,  accent);
  g.addColorStop(0.25, color(accent,.55));
  g.addColorStop(1,  'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx,cy,coreR*1.8,0,Math.PI*2); ctx.fill();

  // bright inner core
  ctx.globalAlpha = 1;
  const ig = ctx.createRadialGradient(cx,cy,0, cx,cy,coreR);
  ig.addColorStop(0,'#ffffff');
  ig.addColorStop(0.4, accent);
  ig.addColorStop(1, color(accent,0));
  ctx.fillStyle = ig;
  ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2); ctx.fill();

  // rotating core iris lines
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(spin*0.6);
  ctx.globalAlpha=.5; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*coreR*0.3, Math.sin(a)*coreR*0.3);
    ctx.lineTo(Math.cos(a)*coreR*0.85, Math.sin(a)*coreR*0.85);
    ctx.stroke();
  }
  ctx.restore();

  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
function color(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* =============================================================
   SPEECH-TO-TEXT  (Web Speech API)
   ============================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function buildRecognizer(){
  if(!SR) return null;
  const r = new SR();
  r.lang='hi-IN'; r.interimResults=true; r.continuous=false;
  r.onresult = (e)=>{
    const txt = Array.from(e.results).map(x=>x[0].transcript).join('');
    const final = e.results[e.results.length-1].isFinal;
    if(final){ commitUser(txt); stopListening(); handle(txt); }
    else showInterim(txt);
  };
  r.onerror = ()=>stopListening();
  r.onend   = ()=>{ if(listening) stopListening(); };
  return r;
}
async function startListening(){
  if(listening) return;
  await startMic();
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  rec = buildRecognizer();
  listening = true; talkBtn.classList.add('live'); setState('listening');
  if(rec){ try{ rec.start(); }catch(_){} }
}
function stopListening(){
  listening=false; talkBtn.classList.remove('live');
  if(rec){ try{ rec.stop(); }catch(_){} rec=null; }
  if(state==='listening') setState('standby');
}

/* =============================================================
   TEXT-TO-SPEECH  (deep British voice if available)
   ============================================================= */
let voices=[];
function loadVoices(){ voices = speechSynthesis.getVoices()||[]; }
loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
function pickVoice(){
  const pref = [/en-GB.*male/i,/Daniel/i,/George/i,/Arthur/i,/en-GB/i,/Google UK English Male/i,/David/i];
  for(const p of pref){ const v=voices.find(v=>p.test(v.name)||p.test(v.lang)); if(v) return v; }
  return voices.find(v=>/en/i.test(v.lang)) || voices[0] || null;
}
function speak(text){
  return new Promise((resolve)=>{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
    u.pitch=0.85; u.rate=0.98;
    setState('speaking');
    u.onboundary = ()=>{ speakingPulse = Math.min(0.5, speakingPulse+0.18); };  // pulse per word
    u.onend = u.onerror = ()=>{ setState('standby'); resolve(); };
    speechSynthesis.speak(u);
  });
}

/* =============================================================
   THE BRAIN  — replace with a fetch() to Claude / secretaryAgent.js
   ============================================================= */
async function askAyus(text){
  // -------------------------------------------------------------
  // TODO(real): POST to your server's secretary endpoint, e.g.
  //   const r = await fetch('/api/secretary', {method:'POST',
  //     headers:{'Content-Type':'application/json'},
  //     body: JSON.stringify({ message: text })});
  //   return (await r.json()).reply;
  // For now, a small in-browser JARVIS persona so the HUD works offline:
  // -------------------------------------------------------------
  const t = text.toLowerCase();
  if(/\b(hi|hello|hey|namaste|hola)\b/.test(t)) return "Online and at your service. What shall we get done?";
  if(t.includes('time')) return "It is " + new Date().toLocaleTimeString() + ", sir.";
  if(t.includes('invoice')||t.includes('payment')) return "Three invoices are overdue. Shall I draft the reminders for your approval?";
  if(t.includes('status')||t.includes('report')) return "All systems nominal. The reactor is stable and the approval queue is clear.";
  if(t.includes('your name')||t.includes('who are you')) return "I am AYUS — your operations intelligence. Think of me as the one who never sleeps.";
  return "Understood. " + (text.length>40 ? "Noted — I'll prepare that and queue it for your approval." : "Right away.");
}

async function handle(text){
  if(!text || !text.trim()) return;
  setState('thinking');
  let reply;
  try { reply = await askAyus(text); }
  catch(_){ reply = "My apologies — I lost the connection to the core."; }
  // brief 'acting' beat for that JARVIS cadence
  setState('acting'); await wait(280);
  addLine('ai', reply);
  await speak(reply);
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* =============================================================
   CONTROLS
   ============================================================= */
const talkBtn = document.getElementById('talkBtn');
const stopBtn = document.getElementById('stopBtn');
const textInput = document.getElementById('text');

talkBtn.onclick = ()=> listening ? stopListening() : startListening();
stopBtn.onclick = ()=>{ speechSynthesis.cancel(); stopListening(); setState('standby'); };
textInput.addEventListener('keydown',(e)=>{
  if(e.key==='Enter' && textInput.value.trim()){
    const v=textInput.value.trim(); textInput.value='';
    commitUser(v); handle(v);
  }
});
// SPACE = push-to-talk (when not typing)
window.addEventListener('keydown',(e)=>{
  if(e.code==='Space' && document.activeElement!==textInput){ e.preventDefault(); if(!listening) startListening(); }
});
window.addEventListener('keyup',(e)=>{
  if(e.code==='Space' && document.activeElement!==textInput && listening){ stopListening(); }
});

/* ---------- boot ---------- */
resize();
setState('standby');
requestAnimationFrame(draw);
if(!SR){ document.getElementById('stateSub').textContent = 'voice input unavailable — type below'; }
// greet after first user gesture (browsers block autoplay audio)
window.addEventListener('pointerdown', function greet(){
  window.removeEventListener('pointerdown', greet);
  speak("AYUS online. Standing by.");
}, {once:true});
</script>
</body>
</html>
