<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workflow Studio</title>
<style>
  :root {
    --bg: #070913; --panel: rgba(15,22,42,0.6); --line: rgba(56,189,248,0.14);
    --ink: #E2E8F0; --muted: #64748B; --accent: #38BDF8; --ok: #10B981;
    --err: #EF4444; --warn: #FACC15; --teal: #5EEAD4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; background:
    radial-gradient(800px 400px at 80% -10%, rgba(56,189,248,0.10), transparent),
    radial-gradient(700px 500px at -10% 110%, rgba(168,85,247,0.08), transparent); }
  a { color: var(--accent); }
  header { display:flex; align-items:center; gap:12px; padding:18px 26px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; letter-spacing:0.5px; }
  header .badge { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); border:1px solid var(--line); padding:3px 8px; border-radius:6px; }
  header .spacer { flex:1; }
  main { max-width:1100px; margin:0 auto; padding:24px 26px 60px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .sub { color:var(--muted); font-size:13px; }
  button { font:inherit; cursor:pointer; border-radius:9px; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--ink); padding:7px 14px; font-weight:600; transition:.15s; }
  button:hover:not(:disabled) { border-color:var(--accent); background:rgba(56,189,248,0.08); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#04121f; }
  button.ghost { background:transparent; }
  button.danger { color:#fca5a5; }
  button.danger:hover { border-color:var(--err); background:rgba(239,68,68,0.08); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .card:hover { border-color:rgba(56,189,248,0.4); }
  .card.off { opacity:.55; }
  .card h3 { margin:2px 0 0; font-size:16px; cursor:pointer; }
  .card h3:hover { color:var(--accent); }
  .card .desc { color:var(--muted); font-size:12.5px; margin:0; }
  .card .meta { color:var(--muted); font-size:11.5px; display:flex; gap:6px; flex-wrap:wrap; }
  .card .acts { display:flex; gap:8px; margin-top:6px; }
  .card .acts button { padding:6px 12px; font-size:12.5px; }
  .ctop { display:flex; align-items:center; gap:8px; }
  .pill { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:3px 8px; border-radius:6px; }
  .p-manual,.p-schedule,.p-event { background:rgba(56,189,248,0.12); color:var(--accent); }
  .p-ok { background:rgba(16,185,129,0.16); color:#6ee7b7; }
  .p-error { background:rgba(239,68,68,0.16); color:#fca5a5; }
  .p-stopped { background:rgba(250,204,21,0.16); color:#fde68a; }
  .p-running { background:rgba(250,204,21,0.16); color:#fde68a; }
  .p-null,.p- { background:rgba(255,255,255,0.06); color:var(--muted); }
  .switch { margin-left:auto; position:relative; width:34px; height:18px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; border-radius:999px; background:rgba(255,255,255,0.14); transition:.2s; cursor:pointer; }
  .slider::before { content:""; position:absolute; width:12px; height:12px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:var(--ok); }
  .switch input:checked + .slider::before { transform:translateX(16px); }
  .empty { text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:14px; padding:44px 20px; }
  .empty .hint { font-size:12.5px; margin-top:8px; max-width:520px; margin-inline:auto; }
  /* editor drawer */
  .backdrop { position:fixed; inset:0; background:rgba(3,6,15,0.6); backdrop-filter:blur(3px); z-index:40; }
  .drawer { position:fixed; top:0; right:0; height:100%; width:min(680px,100%); overflow-y:auto; background:#0a0f1e; border-left:1px solid var(--line); padding:20px 22px 60px; z-index:41; box-shadow:-20px 0 60px rgba(0,0,0,.5); }
  .drawer .ehead { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .drawer .ehead .acts { margin-left:auto; display:flex; gap:8px; align-items:center; }
  input, select, textarea { font:inherit; background:rgba(0,0,0,0.3); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:8px 10px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { width:100%; resize:vertical; line-height:1.45; }
  .name-in { flex:1; background:transparent; border:none; border-bottom:1px solid var(--line); font-size:19px; font-weight:700; border-radius:0; }
  .desc-in { width:100%; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--muted); border-radius:0; margin-bottom:18px; }
  .section { margin-bottom:22px; }
  .section-t { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; font-size:12.5px; color:var(--muted); }
  .field span { font-weight:600; }
  .check { display:inline-flex; gap:6px; align-items:center; color:var(--ink); font-size:12.5px; cursor:pointer; }
  .check input { accent-color:var(--accent); }
  .ttabs { display:flex; gap:6px; margin-bottom:10px; }
  .ttab { color:var(--muted); }
  .ttab.on { background:rgba(56,189,248,0.14); color:var(--accent); border-color:rgba(56,189,248,0.45); }
  .webhook code { display:block; margin-top:6px; padding:8px 10px; background:rgba(0,0,0,0.35); border:1px solid var(--line); border-radius:8px; color:var(--teal); font-size:12px; word-break:break-all; }
  .steps { display:flex; flex-direction:column; gap:10px; }
  .step { border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,0.02); overflow:hidden; }
  .step .shead { display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(255,255,255,0.025); }
  .step .snum { width:20px; height:20px; display:grid; place-items:center; background:rgba(56,189,248,0.14); color:var(--accent); border-radius:6px; font-size:11px; font-weight:700; }
  .step .sname { flex:1; background:transparent; border:none; font-weight:600; padding:4px; border-radius:0; }
  .step .stype { font-size:10.5px; color:var(--muted); text-transform:uppercase; }
  .icon-btn { width:24px; height:24px; padding:0; color:var(--muted); }
  .scfg { padding:10px 12px; }
  .scfg .hint { font-size:11.5px; color:var(--muted); font-style:italic; margin-bottom:8px; }
  .add-step { width:100%; border-style:dashed; color:var(--muted); margin-top:10px; }
  .palette { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px; }
  .palette button { text-align:left; display:flex; gap:8px; }
  .runs { display:flex; flex-direction:column; gap:8px; }
  .run { border:1px solid var(--line); border-radius:10px; padding:10px; background:rgba(0,0,0,0.2); }
  .run .rhead { display:flex; align-items:center; gap:8px; font-size:12px; }
  .run .rwhen { margin-left:auto; color:var(--muted); font-size:11.5px; }
  .logline { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:4px; }
  .logline .dot { width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none; }
  .logline.err .dot { background:var(--err); } .logline.stopped .dot { background:var(--warn); }
  .logline .msg { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .logline .ms { color:var(--muted); font-size:11px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#0f1728; border:1px solid var(--line); padding:10px 18px; border-radius:10px; z-index:60; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .toast.err { border-color:var(--err); } .toast.ok { border-color:var(--ok); } .toast.warn { border-color:var(--warn); }
  .muted { color:var(--muted); }
  @media (max-width:640px){ .palette{grid-template-columns:1fr} .drawer{width:100%} }
</style>
</head>
<body>
<header>
  <h1>⚡ Workflow Studio</h1>
  <span class="badge">standalone</span>
  <div class="spacer"></div>
  <button class="primary" id="new-btn">+ New workflow</button>
</header>
<main>
  <div class="row">
    <div>
      <div style="font-size:16px;font-weight:700">Your workflows</div>
      <div class="sub" id="count">—</div>
    </div>
  </div>
  <div id="list"></div>
</main>
<div id="editor-root"></div>
<script src="app.js"></script>
</body>
</html>
